<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patients - Life Care Medical Laboratory</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f7f8;
    color: #222;
}

/* HEADER */

header {
    background: #087f8c;
    color: white;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.logo h1 {
    font-size: 24px;
}

.logo p {
    font-size: 13px;
    margin-top: 4px;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 9px 12px;
    border-radius: 5px;
}

nav a:hover {
    background: rgba(255,255,255,0.2);
}

/* CONTAINER */

.container {
    width: 94%;
    max-width: 1300px;
    margin: 30px auto;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.title h2 {
    color: #087f8c;
}

/* ADD BUTTON */

.add-btn {
    background: #087f8c;
    color: white;
    text-decoration: none;
    padding: 11px 16px;
    border-radius: 6px;
}

.add-btn:hover {
    background: #05636d;
}

/* SEARCH */

.search-box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.search-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

/* TABLE */

.table-container {
    background: white;
    padding: 15px;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
}

table {
    width: 100%;
    min-width: 1000px;
    border-collapse: collapse;
}

th,
td {
    padding: 12px 10px;
    border: 1px solid #ddd;
    text-align: left;
}

th {
    background: #087f8c;
    color: white;
}

tr:nth-child(even) {
    background: #f7fafa;
}

tr:hover {
    background: #eef8f8;
}

/* STATUS */

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.completed {
    background: #d4edda;
    color: #155724;
}

/* ACTION BUTTONS */

.action-btn {
    display: inline-block;
    padding: 7px 10px;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
    margin: 2px;
}

.edit-btn {
    background: #1976d2;
}

.report-btn {
    background: #087f8c;
}

.delete-btn {
    background: #d32f2f;
    border: none;
    cursor: pointer;
}

/* NO DATA */

.no-data {
    text-align: center;
    padding: 35px;
    color: #777;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <h1>Life Care Medical Laboratory</h1>

        <p>Laboratory Management System</p>

    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="patient.html">
            Add Patient
        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="login.html"
           onclick="logout()">
            Logout
        </a>

    </nav>

</header>



<!-- MAIN -->

<div class="container">


    <div class="title">

        <h2>Patient Records</h2>

        <a href="patient.html"
           class="add-btn">

            + Add New Patient

        </a>

    </div>



    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search patient by name, test or doctor..."
            onkeyup="displayPatients()"
        >

    </div>



    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Patient Name</th>

                    <th>Age</th>

                    <th>Gender</th>

                    <th>Test Type</th>

                    <th>Doctor</th>

                    <th>Date</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="patientTable">

            </tbody>

        </table>

    </div>


</div>



<script>

/* LOGIN CHECK */

if (localStorage.getItem("loggedIn") !== "true") {

    window.location.href = "login.html";

}


/* DISPLAY PATIENTS */

function displayPatients() {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    let search =
        document.getElementById("search")
        .value
        .toLowerCase();


    let table =
        document.getElementById("patientTable");


    table.innerHTML = "";


    let filteredPatients =
        patients.filter(function(patient) {

            return (

                patient.name
                .toLowerCase()
                .includes(search)

                ||

                patient.testType
                .toLowerCase()
                .includes(search)

                ||

                patient.doctor
                .toLowerCase()
                .includes(search)

            );

        });


    if (filteredPatients.length === 0) {

        table.innerHTML = `
        
        <tr>
            <td colspan="9" class="no-data">
                No patient records found.
            </td>
        </tr>

        `;

        return;

    }


    filteredPatients.forEach(function(patient) {


        let statusClass =
            patient.status === "Completed"
            ? "completed"
            : "pending";


        let row = document.createElement("tr");


        row.innerHTML = `

            <td>${patient.id}</td>

            <td>${escapeHTML(patient.name)}</td>

            <td>${escapeHTML(patient.age)}</td>

            <td>${escapeHTML(patient.gender)}</td>

            <td>${escapeHTML(patient.testType)}</td>

            <td>${escapeHTML(patient.doctor)}</td>

            <td>${escapeHTML(patient.date)}</td>

            <td>

                <span class="status ${statusClass}">
                    ${escapeHTML(patient.status)}
                </span>

            </td>

            <td>

                <a
                    href="edit.html?id=${patient.id}"
                    class="action-btn edit-btn"
                >
                    Edit
                </a>


                <a
                    href="report.html?id=${patient.id}"
                    class="action-btn report-btn"
                >
                    Report
                </a>


                <button
                    onclick="deletePatient(${patient.id})"
                    class="action-btn delete-btn"
                >
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });

}


/* DELETE PATIENT */

function deletePatient(id) {

    let confirmDelete =
        confirm(
            "Are you sure you want to delete this patient?"
        );


    if (!confirmDelete) {
        return;
    }


    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    patients =
        patients.filter(function(patient) {

            return patient.id !== id;

        });


    localStorage.setItem(
        "patients",
        JSON.stringify(patients)
    );


    displayPatients();

}


/* SECURITY */

function escapeHTML(text) {

    let div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* LOGOUT */

function logout() {

    localStorage.removeItem("loggedIn");

}


/* LOAD */

displayPatients();

</script>


</body>

</html>
