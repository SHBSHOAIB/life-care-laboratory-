<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Life Care Medical Laboratory</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #087f8c, #05b8a9);
}

.container {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    color: #087f8c;
    font-size: 30px;
}

.logo p {
    color: #666;
    margin-top: 5px;
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #087f8c;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #05636d;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.register-link {
    text-align: center;
    margin-top: 20px;
    color: #555;
}

.register-link a {
    color: #087f8c;
    text-decoration: none;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Life Care</h1>
        <p>Medical Laboratory</p>
    </div>

    <h2>Staff Login</h2>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="message" id="message"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let savedStaff = localStorage.getItem("staff");

    if (savedStaff === null) {

        document.getElementById("message").innerText =
            "Please register first.";

        document.getElementById("message").style.color = "red";

        return;
    }

    let staff = JSON.parse(savedStaff);

    if (
        email === staff.email &&
        password === staff.password
    ) {

        localStorage.setItem("loggedIn", "true");

        document.getElementById("message").innerText =
            "Login successful!";

        document.getElementById("message").style.color = "green";

        setTimeout(function() {

            window.location.href = "dashboard.html";

        }, 1000);

    } else {

        document.getElementById("message").innerText =
            "Invalid email or password.";

        document.getElementById("message").style.color = "red";
    }

});

</script>

</body>
</html>
