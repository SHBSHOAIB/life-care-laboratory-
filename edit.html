<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Test - Life Care Medical Laboratory</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f7f8;
    color: #222;
}

/* HEADER */

header {
    background: #087f8c;
    color: white;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.logo h1 {
    font-size: 24px;
}

.logo p {
    font-size: 13px;
    margin-top: 4px;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 9px 12px;
    border-radius: 5px;
}

nav a:hover {
    background: rgba(255,255,255,0.2);
}

/* CONTAINER */

.container {
    width: 90%;
    max-width: 750px;
    margin: 35px auto;
}

/* FORM BOX */

.form-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-box h2 {
    text-align: center;
    color: #087f8c;
    margin-bottom: 25px;
}

/* PATIENT INFO */

.patient-info {
    background: #eef8f8;
    padding: 18px;
    border-radius: 8px;
    margin-bottom: 25px;
}

.patient-info p {
    margin: 7px 0;
}

.patient-info strong {
    color: #087f8c;
}

/* FORM */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #444;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #087f8c;
}

/* BUTTON */

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #087f8c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #05636d;
}

/* MESSAGE */

.message {
    display: none;
    padding: 12px;
    margin-bottom: 20px;
    text-align: center;
    border-radius: 6px;
    font-weight: bold;
}

.success {
    display: block;
    background: #d9f7df;
    color: #176b2c;
}

.error {
    display: block;
    background: #ffdede;
    color: #b71c1c;
}

/* BACK */

.back {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #087f8c;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <h1>Life Care Medical Laboratory</h1>

        <p>Laboratory Management System</p>

    </div>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="patient.html">
            Add Patient
        </a>

        <a href="patients.html">
            Patients
        </a>

        <a href="login.html"
           onclick="logout()">
            Logout
        </a>

    </nav>

</header>



<!-- MAIN -->

<div class="container">


    <div class="form-box">

        <h2>Update Test Result</h2>


        <div id="message"
             class="message">
        </div>


        <!-- PATIENT INFORMATION -->

        <div class="patient-info">

            <p>
                <strong>Patient Name:</strong>
                <span id="patientName"></span>
            </p>

            <p>
                <strong>Age:</strong>
                <span id="patientAge"></span>
            </p>

            <p>
                <strong>Gender:</strong>
                <span id="patientGender"></span>
            </p>

            <p>
                <strong>Test Type:</strong>
                <span id="patientTest"></span>
            </p>

            <p>
                <strong>Doctor:</strong>
                <span id="patientDoctor"></span>
            </p>

        </div>



        <form id="editForm">


            <!-- TEST RESULT -->

            <div class="form-group">

                <label>
                    Test Result
                </label>

                <input
                    type="text"
                    id="result"
                    placeholder="Example: 95 mg/dL"
                    required
                >

            </div>



            <!-- NORMAL RANGE -->

            <div class="form-group">

                <label>
                    Normal Range
                </label>

                <input
                    type="text"
                    id="normalRange"
                    placeholder="Example: 70 - 100 mg/dL"
                    required
                >

            </div>



            <!-- ADDITIONAL NOTES -->

            <div class="form-group">

                <label>
                    Additional Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Enter any additional laboratory notes..."
                ></textarea>

            </div>



            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Test Status
                </label>

                <select id="status" required>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>



            <button type="submit">
                Save Test Result
            </button>


        </form>


        <a href="patients.html" class="back">
            ← Back to Patient Records
        </a>

    </div>

</div>



<script>

/* LOGIN CHECK */

if (localStorage.getItem("loggedIn") !== "true") {

    window.location.href = "login.html";

}


/* GET PATIENT ID FROM URL */

let urlParams =
    new URLSearchParams(window.location.search);

let patientId =
    Number(urlParams.get("id"));


/* GET PATIENTS */

let patients =
    JSON.parse(localStorage.getItem("patients")) || [];


/* FIND PATIENT */

let patient =
    patients.find(function(item) {

        return item.id === patientId;

    });


/* IF PATIENT NOT FOUND */

if (!patient) {

    alert("Patient record not found.");

    window.location.href = "patients.html";

}


/* SHOW PATIENT DATA */

document.getElementById("patientName").innerText =
    patient.name;

document.getElementById("patientAge").innerText =
    patient.age;

document.getElementById("patientGender").innerText =
    patient.gender;

document.getElementById("patientTest").innerText =
    patient.testType;

document.getElementById("patientDoctor").innerText =
    patient.doctor;


/* LOAD OLD DATA */

document.getElementById("result").value =
    patient.result || "";

document.getElementById("normalRange").value =
    patient.normalRange || "";

document.getElementById("notes").value =
    patient.notes || "";

document.getElementById("status").value =
    patient.status || "Pending";


/* SAVE */

document
.getElementById("editForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    patient.result =
        document.getElementById("result").value.trim();


    patient.normalRange =
        document.getElementById("normalRange").value.trim();


    patient.notes =
        document.getElementById("notes").value.trim();


    patient.status =
        document.getElementById("status").value;


    /* UPDATE ARRAY */

    let index =
        patients.findIndex(function(item) {

            return item.id === patientId;

        });


    patients[index] = patient;


    /* SAVE */

    localStorage.setItem(
        "patients",
        JSON.stringify(patients)
    );


    /* MESSAGE */

    let message =
        document.getElementById("message");

    message.innerText =
        "Test result saved successfully!";

    message.className =
        "message success";


    /* GO BACK */

    setTimeout(function() {

        window.location.href = "patients.html";

    }, 1000);

});


/* LOGOUT */

function logout() {

    localStorage.removeItem("loggedIn");

}

</script>


</body>

</html>
