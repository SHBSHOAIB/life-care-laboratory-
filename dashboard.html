<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Life Care Medical Laboratory</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f7f8;
    color: #222;
}

/* Header */

header {
    background: #087f8c;
    color: white;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.logo h1 {
    font-size: 24px;
}

.logo p {
    font-size: 13px;
    margin-top: 3px;
}

nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 9px 12px;
    border-radius: 5px;
}

nav a:hover {
    background: rgba(255,255,255,0.2);
}

/* Main */

.container {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    color: #087f8c;
}

.welcome p {
    margin-top: 8px;
    color: #555;
}

/* Cards */

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.card .icon {
    font-size: 40px;
}

.card h3 {
    margin-top: 12px;
    color: #444;
}

.card p {
    font-size: 30px;
    color: #087f8c;
    margin-top: 8px;
    font-weight: bold;
}

/* Quick Actions */

.quick-actions {
    margin-top: 30px;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

.quick-actions h2 {
    margin-bottom: 20px;
    color: #087f8c;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    text-decoration: none;
    background: #087f8c;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
}

.btn:hover {
    background: #05636d;
}

.logout {
    background: #d32f2f;
}

.logout:hover {
    background: #a92323;
}

/* Mobile */

@media (max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

    .cards {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">

        <h1>Life Care Medical Laboratory</h1>

        <p>Laboratory Management System</p>

    </div>


    <nav>

        <a href="dashboard.html">Dashboard</a>

        <a href="patient.html">Add Patient</a>

        <a href="patients.html">Patients</a>

        <a href="login.html" onclick="logout()">Logout</a>

    </nav>

</header>



<main class="container">


    <div class="welcome">

        <h2>Dashboard</h2>

        <p id="welcomeText">
            Welcome to Life Care Medical Laboratory.
        </p>

    </div>



    <div class="cards">


        <div class="card">

            <div class="icon">👨‍⚕️</div>

            <h3>Total Patients</h3>

            <p id="totalPatients">0</p>

        </div>



        <div class="card">

            <div class="icon">🧪</div>

            <h3>Pending Tests</h3>

            <p id="pendingTests">0</p>

        </div>



        <div class="card">

            <div class="icon">✅</div>

            <h3>Completed Tests</h3>

            <p id="completedTests">0</p>

        </div>


    </div>



    <div class="quick-actions">

        <h2>Quick Actions</h2>


        <div class="buttons">

            <a href="patient.html" class="btn">
                + Add New Patient
            </a>


            <a href="patients.html" class="btn">
                👥 Patient Records
            </a>


            <a href="patients.html" class="btn">
                📄 Reports
            </a>


            <a href="login.html"
               class="btn logout"
               onclick="logout()">
                Logout
            </a>

        </div>

    </div>


</main>



<script>

/* Login Check */

let loggedIn = localStorage.getItem("loggedIn");

if (loggedIn !== "true") {

    window.location.href = "login.html";

}


/* Staff Name */

let savedStaff = localStorage.getItem("staff");

if (savedStaff) {

    let staff = JSON.parse(savedStaff);

    document.getElementById("welcomeText").innerText =
        "Welcome, " + staff.name + "!";


}


/* Patient Data */

function updateDashboard() {

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];


    let total = patients.length;


    let pending = patients.filter(function(patient) {

        return patient.status === "Pending";

    }).length;


    let completed = patients.filter(function(patient) {

        return patient.status === "Completed";

    }).length;


    document.getElementById("totalPatients").innerText =
        total;


    document.getElementById("pendingTests").innerText =
        pending;


    document.getElementById("completedTests").innerText =
        completed;

}


updateDashboard();


/* Logout */

function logout() {

    localStorage.removeItem("loggedIn");

}

</script>


</body>
</html>
